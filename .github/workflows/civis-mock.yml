name: CIVIS mock checks

on:
  pull_request:
    branches: [codex/civis-elyes, brain]
  push:
    branches: [codex/civis-elyes, codex/civis-yassine, codex/civis-meriem, codex/civis-maram]

permissions:
  contents: read

concurrency:
  group: civis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    name: CIVIS file ownership
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check member file boundaries
        if: github.event_name == 'pull_request' && github.base_ref == 'codex/civis-elyes'
        env:
          WORK_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $taskChecker = Join-Path $env:RUNNER_TEMP 'civis-ownership.py'
          git show "${env:BASE_SHA}:brain/scripts/check_ownership.py" | Set-Content -LiteralPath $taskChecker -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Cannot load the base ownership checker.' }
          python $taskChecker --branch $env:WORK_BRANCH --base-branch $env:BASE_BRANCH --base-sha $env:BASE_SHA --head-sha $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'CIVIS file ownership failed.' }
      - name: Release branch check
        if: github.event_name == 'pull_request' && github.base_ref == 'brain'
        env:
          WORK_BRANCH: ${{ github.head_ref }}
        run: |
          if ($env:WORK_BRANCH -ne 'codex/civis-elyes') {
            throw 'Use the CIVIS integration branch for the release PR.'
          }
  bootstrap:
    name: CIVIS bootstrap
    runs-on: windows-latest
    defaults:
      run:
        working-directory: brain
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: brain/requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src mocks tests scripts
      - run: python -m pytest -q
