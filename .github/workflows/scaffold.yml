name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scaffold:
    name: Scaffold checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_setup.py
      - run: python twin/src/main.py
      - run: python brain/src/main.py
      - run: python guardian/src/main.py
      - run: python scenarios/run.py scaffold-smoke
