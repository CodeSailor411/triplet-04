[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civis-brain-mock"
version = "0.0.1"
description = "CIVIS primary mock development scaffold"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools]
packages = [
    "civis_brain", "civis_brain.inputs", "civis_brain.planning", "civis_brain.integration",
    "civis_brain.scenarios", "civis_brain.scenarios.traffic", "civis_brain.scenarios.water",
    "civis_brain.scenarios.power", "civis_brain.scenarios.air_quality",
    "civis_brain.scenarios.emergency", "civis_mock_peers",
]
package-dir = {"" = "src", "civis_mock_peers" = "mocks/civis_mock_peers"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "mocks"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
civis_brain = ["debug.html"]
