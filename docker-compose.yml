# Triplet 04: start the layers with one command.
#   cp .env.example .env      (then change the keys; see the notes in .env.example)
#   docker compose up --build
# Twin: http://127.0.0.1:8000    Dashboard: http://127.0.0.1:8080
#
# Twin and dashboard are ready. The Brain and the Guardian are commented out below until CIVIS and
# 9antra add them. A Brain block needs Docker Compose 2.24 or newer (optional brain/.env.partner).

services:
  twin:
    build: ./twin
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Run logs land on the host, so scenarios/ scripts and the log merge work from there.
      - ./twin/run-logs:/app/twin/run-logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build: ./twin
    command: ["python", "-m", "twin.dashboard", "--host", "0.0.0.0", "--feed-url", "http://twin:8000", "--sources", "run-logs"]
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./twin/run-logs:/app/twin/run-logs:ro
    depends_on:
      twin:
        condition: service_healthy
    restart: unless-stopped

